---
- name: Load vault
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Include vault variables
      ansible.builtin.include_vars:
        file: vault.yml

- name: Apply common configuration to all ECS nodes
  hosts: role_ecs_node
  become: true
  serial: 1
  roles:
    - common

- name: Deploy vulnerable apps on apps host
  hosts: role_apps
  become: true
  roles:
    - vulnerable_apps

- name: Configure Kong OSS gateway and routes
  hosts: localhost
  gather_facts: false
  roles:
    - kong

- name: Verify NGINX OSS gateway
  hosts: localhost
  gather_facts: false
  roles:
    - nginx

- name: Verify Flex Gateway (MuleSoft) is reachable
  hosts: localhost
  gather_facts: false
  roles:
    - mulesoft

- name: Configure Noname gateway integrations
  hosts: localhost
  gather_facts: false
  roles:
    - noname_integration
