---
# NGINX OSS runs as an ECS task. This role pushes a custom nginx.conf
# via the ECS exec API or by updating the task definition and forcing redeployment.

- name: Wait for NGINX to respond
  ansible.builtin.uri:
    url: "{{ nginx_health_url }}"
    method: GET
    status_code: [200, 404]
  register: nginx_health
  retries: 20
  delay: 10
  until: nginx_health.status in [200, 404]
  delegate_to: localhost

- name: Deploy nginx.conf template to ECS nodes
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
  notify: reload nginx
