---
# Verifies Anypoint Flex Gateway is reachable via its ALB.
# The gateway registers itself with Anypoint Platform at startup using registration.yaml
# injected from SSM — no Ansible tasks are needed for that registration step.
# mulesoft_alb_dns is passed as an extra-var from Terraform output by the Makefile.

- name: Wait for Flex Gateway ALB to become reachable
  ansible.builtin.uri:
    url: "http://{{ mulesoft_alb_dns }}/api/v1/health-check"
    method: GET
    status_code: [200, 404, 503]
  register: mule_health
  retries: 20
  delay: 15
  until: mule_health.status in [200, 404, 503]
  delegate_to: localhost

- name: Flex Gateway status
  ansible.builtin.debug:
    msg: "Flex Gateway ALB responding at http://{{ mulesoft_alb_dns }} (HTTP {{ mule_health.status }}). Check Anypoint Runtime Manager to confirm it shows as Connected."
