---
# Verifies Anypoint Flex Gateway ALB is reachable.
# In connected mode the gateway has zero envoy listeners until proxy APIs are
# deployed from Anypoint API Manager — so a 502 from envoy is expected and
# counts as "reachable" for this check. Once a proxy API is deployed the
# gateway responds normally on its configured paths.
# mulesoft_alb_dns is passed as an extra-var from Terraform output by the Makefile.

- name: Wait for Flex Gateway ALB to respond
  ansible.builtin.uri:
    url: "http://{{ mulesoft_alb_dns }}/"
    method: GET
    status_code: [200, 404, 502, 503]
  register: mule_health
  retries: 10
  delay: 10
  until: mule_health.status in [200, 404, 502, 503]
  delegate_to: localhost

- name: Flex Gateway status
  ansible.builtin.debug:
    msg: >-
      Flex Gateway ALB responding at http://{{ mulesoft_alb_dns }} (HTTP {{ mule_health.status }}).
      {% if mule_health.status == 502 %}Status 502 means envoy has no listeners yet — deploy a proxy API to this gateway from Anypoint API Manager to start serving traffic.{% else %}Check Anypoint Runtime Manager to confirm gateway shows as Connected.{% endif %}
