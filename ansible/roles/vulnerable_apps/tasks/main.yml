---
- name: Install Docker and git
  ansible.builtin.dnf:
    name:
      - docker
      - git
    state: present

- name: Start and enable Docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Install Docker Compose binary
  ansible.builtin.get_url:
    url: "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64"
    dest: /usr/local/bin/docker-compose
    mode: "0755"
    timeout: 60

- name: Tear down legacy vapi stack (one-time cleanup; image was empty and replaced by Juice Shop)
  ansible.builtin.shell: |
    if [ -f /opt/apps/vapi/docker-compose.yml ]; then
      cd /opt/apps/vapi && /usr/local/bin/docker-compose down -v --remove-orphans || true
      rm -rf /opt/apps/vapi
      echo "removed"
    fi
  args:
    executable: /bin/bash
  register: vapi_cleanup
  changed_when: "'removed' in vapi_cleanup.stdout"

- name: Create app directories
  ansible.builtin.file:
    path: "/opt/apps/{{ item }}"
    state: directory
    owner: ec2-user
    mode: "0755"
  loop:
    - crapi
    - juiceshop
    - vampi
    - dvga
    - pixi

- name: Deploy Docker Compose files
  ansible.builtin.template:
    src: "{{ item }}-compose.yml.j2"
    dest: "/opt/apps/{{ item }}/docker-compose.yml"
    owner: ec2-user
    mode: "0644"
  loop:
    - crapi
    - juiceshop
    - vampi
    - dvga
    - pixi
  notify: restart apps

- name: Pull and start all apps
  ansible.builtin.command:
    cmd: docker-compose up -d --pull always
    chdir: "/opt/apps/{{ item }}"
  loop:
    - crapi
    - juiceshop
    - vampi
    - dvga
    - pixi
  changed_when: true
