---
- name: Wait for Kong Admin API to be available
  ansible.builtin.uri:
    url: "{{ kong_admin_url }}/status"
    method: GET
    status_code: 200
  register: kong_status
  retries: 20
  delay: 10
  until: kong_status.status == 200
  delegate_to: localhost

- name: Push declarative config
  ansible.builtin.uri:
    url: "{{ kong_admin_url }}/config"
    method: POST
    body_format: json
    body:
      _format_version: "3.0"
      services:
        - name: crapi
          url: "http://{{ apps_alb_dns }}:8080"
          routes:
            - name: crapi-route
              paths:
                - /crapi
              strip_path: true
        - name: pixi
          url: "http://{{ apps_alb_dns }}:8888"
          routes:
            - name: pixi-route
              paths:
                - /pixi
              strip_path: true
        - name: sample
          url: "http://httpbin.org"
          routes:
            - name: sample-route
              paths:
                - /sample
              strip_path: true
    status_code: [200, 201]
  delegate_to: localhost
