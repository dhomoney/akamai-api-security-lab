plugin: amazon.aws.aws_ec2
profile: SA_Standard_Access-491489166083
regions:
  - us-east-2

filters:
  tag:Project: homoney-akamai-lab
  tag:Environment: lab
  instance-state-name: running

keyed_groups:
  - key: tags.Role
    prefix: role
    separator: "_"
  - key: tags.Name
    prefix: name
    separator: "_"

hostnames:
  - private-ip-address

compose:
  ansible_host: private_ip_address
